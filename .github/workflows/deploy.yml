name: Deploy docker image and update production

on:
    push:
        branches:
            - "main"

env:
    REGISTRY: ghcr.io
    DEPLOY_USER: root
    HOST: ${{ vars.HOST }}
    DOCKER_STACK_NAME: ypod
    ROOT_SSH_PRIVATE_KEY: ${{ secrets.ROOT_SSH_PRIVATE_KEY }}

jobs:
    build-and-push-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            attestations: write
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v2
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Get repository name in lowercase
              run: echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:latest
                      ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ github.sha }}
                  build-args: |
                      GIT_COMMIT_SHA=${{ github.sha }}

    deploy:
        runs-on: ubuntu-latest
        needs:
            - build-and-push-image
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Create env file
              run: |
                  echo "GIT_COMMIT_SHA='${{ github.sha }}'" >> ./envfile
                  echo "YOUTUBE_API_KEY='${{ secrets.YOUTUBE_API_KEY }}'" >> ./envfile
                  echo "GOOGLE_CLIENT_ID='${{ vars.GOOGLE_CLIENT_ID }}'" >> ./envfile
                  echo "MONGO_URI='${{ secrets.MONGO_URI }}'" >> ./envfile

            - name: Docker Stack Deploy
              uses: cssnr/stack-deploy-action@v1
              with:
                  name: ${{ env.DOCKER_STACK_NAME }}
                  file: docker-stack.yml
                  host: ${{ env.HOST }}
                  user: ${{ env.DEPLOY_USER }}
                  ssh_key: ${{ env.ROOT_SSH_PRIVATE_KEY }}
                  env_file: ./envfile
